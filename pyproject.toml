[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgecheck"
version = "0.1.0"
description = "LLM eval reliability toolkit: catch misleading judge scores with perturbation tests, agreement checks, and confidence intervals."
requires-python = ">=3.12"
dependencies = ["anthropic"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/judgecheck"]
